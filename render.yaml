services:
  - type: web
    name: internship-tracker
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_DRIVER
        value: sqlite
      - key: SQLITE_PATH
        value: /app/data/internship_tracker.db
      - key: STATIC_DIR
        value: /app/dist
      - key: GIN_MODE
        value: release

